# =============================================================================
# GDUECA 官网 - Nginx 反向代理配置（自建节点：腾讯云 / 阿里云 / 海外 VPS）
#
# 协议兼容矩阵：
#   HTTP/1.0、HTTP/1.1  —— Nginx 天然支持（含 keep-alive），无需额外配置
#   HTTP/2              —— `http2 on;`（Nginx >= 1.25.1）
#   HTTP/3 (QUIC)       —— `listen 443 quic;`（Nginx >= 1.25，需编译 --with-http_v3_module）
#                          Ubuntu 24.04+ / nginx.org 官方包已内置；老版本删掉 quic 行即可
#   TLS 1.2 + TLS 1.3   —— 最低 1.2（IE11 on Win7/8.1/10 均支持）
#   TLS 1.0/1.1、SSL 2.0/3.0 —— 不启用：已被 RFC 8996 废弃、PCI-DSS 禁止、
#                              现代浏览器拒绝握手；IE11 使用 TLS 1.2 不受影响
#
# 使用方式：
#   1. 将本文件放入 /etc/nginx/conf.d/gdueca.conf
#   2. 证书放 /etc/nginx/certs/（全站统一一张泛域名证书即可：*.paperee.guru）
#   3. nginx -t && systemctl reload nginx
#   4. 防火墙/安全组放行 UDP 443（HTTP/3 必需）+ TCP 443/80
# =============================================================================

# ---- 请求链路追踪：入口生成 $request_id，经 X-Request-ID 传给后端，后端作为 traceId 沿用 ----
# log_format 只能写在 http {} 中（如 /etc/nginx/nginx.conf），示例：
# log_format gdueca '$remote_addr [$time_iso8601] "$request_method $uri" $status '
#                   '$request_time trace=$request_id';
# access_log /var/log/nginx/gdueca.access.log gdueca;

# ---- HTTP/3 全局（可选：UDP 443 被运营商拦截时客户端自动回落 HTTP/2/TCP）----
# 同一端口只能有一个 server 带 reuseport；第二个 server 用不带 reuseport 的写法
# quic_retry on;              # QUIC 地址验证防放大攻击
# quic_gso on;                # Linux UDP GSO 分段提速

# ---- 主站：Next.js 前端 ----
server {
    listen 80;
    listen [::]:80;
    server_name gdue-ca.paperee.guru;
    # ACME 证书续期走 80 端口，其余全部 301 到 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2（Nginx < 1.25.1 老语法：listen 443 ssl http2;）
    http2 on;
    # HTTP/3 / QUIC（需要 http_v3_module；无该模块则删除本行）
    listen 443 quic reuseport;
    listen [::]:443 quic;
    server_name gdue-ca.paperee.guru;

    # ---- TLS ----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 套件：ECDHE GCM/CHACHA20 为主 + CBC 兜底（覆盖 Win7 IE11 等老客户端）
    # TLS 1.3 套件由 OpenSSL 内置默认启用，无需手动列出
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA;
    ssl_prefer_server_ciphers off;   # TLS 1.3 官方推荐由客户端选套件
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;          # 老客户端复用会话，降低握手开销
    # OCSP 装订（自签/无 OCSP URL 的证书删掉这两行）
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # ---- HSTS（全站 HTTPS 后开启；后端 API 响应已自带 HSTS）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 隐藏 Nginx 版本号
    server_tokens off;

    # HTTP/3 服务发现（与 next.config.ts 的 Alt-Svc 头一致；二选一即可，重复无冲突）
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # ---- 压缩 ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- 安全：本机是最外层入口，X-Forwarded-For 一律用真实 TCP 对端覆盖（不追加），
    #      防止客户端伪造 XFF 冒充内网绕过后台访问限制 ----

    # ---- 后台管理页面：仅允许私有内网访问（等保：管理终端接入限制）----
    # 后端接口层同样按账号角色强制校验内网来源，此处为纵深防御
    location /admin {
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow ::1;
        allow fc00::/7;
        deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;       # 链路追踪 traceId
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 同源 API：直接反代到 FastAPI（Cookie 为第一方 Cookie，无需 CORS）----
    location ~ ^/(api|uploads)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;       # 链路追踪 traceId
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 6m;            # 头像上传 ≤5MB 留余量
    }

    # ---- 反代到 Next.js 生产服务（pnpm start，仅监听 127.0.0.1:3000）----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;        # WebSocket（dev HMR 用）
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;       # 链路追踪 traceId
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源长缓存（Next.js 不可变资源带内容哈希）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ---- API：FastAPI 后端独立子域名（可选）----
# 推荐使用上面主站的同源 /api 反代；仅在前端配置 NEXT_PUBLIC_API_BASE_URL 跨域访问时启用，
# 此时后端 .env 的 CORS_ORIGINS 必须写明主站来源（如 https://gdue-ca.paperee.guru）
server {
    listen 80;
    listen [::]:80;
    server_name api.paperee.guru;          # 按实际 API 子域名调整
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic;                        # 同端口第二个 server：不带 reuseport
    listen [::]:443 quic;
    server_name api.paperee.guru;           # 按实际 API 子域名调整

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 256;

    # ---- 反代到 FastAPI（gunicorn -k uvicorn.workers.UvicornWorker，端口 8000）----
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;       # 链路追踪 traceId
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 6m;            # 头像上传 ≤5MB 留余量
    }
}

