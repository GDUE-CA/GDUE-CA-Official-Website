# =============================================================================
# GDUECA 一体化镜像 - Nginx 入口（容器内以非 root 用户运行，监听 8080）
#
#   /api/*、/uploads/*  → FastAPI  127.0.0.1:8000
#   /health             → FastAPI  健康检查
#   其余                → Next.js  127.0.0.1:3000
#   Next.js 502/504     → 静态维护页（状态码 503，与宿主机 Nginx 一致）
#
# 安全要点：
# - X-Forwarded-For 用真实对端覆盖（不追加），后端据此做管理员可信 IP 白名单
#   （ADMIN_TRUSTED_IPS）、登录限流与审计
# - 前面还有负载均衡 / CDN 时，必须通过环境变量 REAL_IP_FROM 声明其网段，
#   否则所有请求的来源都会是负载均衡的地址，IP 白名单与限流将失效
# - $request_id 作为 request id 经 X-Request-ID 传给后端，Nginx 与后端日志可按同一 ID 串联
# =============================================================================

worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 非 root 运行：临时目录放到可写的 /tmp
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # 与后端日志同一格式：时间 级别 [req=…] 来源 | 内容
    log_format gdueca '$time_iso8601 INFO  [req=$request_id] nginx.access | '
                      '$request_method $uri $status ${request_time}s ip=$remote_addr';
    # 容器健康检查请求（带 X-Health-Check 头）不写访问日志
    map $http_x_health_check $loggable {
        "1"     0;
        default 1;
    }
    access_log /dev/stdout gdueca if=$loggable;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 6m;          # 头像上传 ≤5MB 留余量

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # 外层负载均衡 / CDN 的真实 IP 还原（由 entrypoint 按 REAL_IP_FROM 生成，未配置时为空）
    include /tmp/nginx/real_ip.conf;

    # 外层已终止 TLS 时沿用其协议头，否则用本层协议
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream backend  { server 127.0.0.1:8000; keepalive 16; }
    upstream frontend { server 127.0.0.1:3000; keepalive 16; }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID      $request_id;
        proxy_read_timeout 60s;

        # 后台页面位于 /{locale}/admin，访问控制由后端强制执行：
        # /api/admin/* 全局校验管理员会话，来源 IP 按 ADMIN_TRUSTED_IPS 白名单限制

        location ~ ^/(api|uploads)/ {
            proxy_pass http://backend;
        }

        location = /health {
            access_log off;
            proxy_pass http://backend;
        }

        # Next.js 带内容哈希的静态资源：长缓存
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_hide_header Cache-Control;    # 以本层为准，避免与 Next.js 的同名头重复
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 静态维护页（frontend/components/maintenance/，镜像构建时放入）
        location ^~ /maintenance/ {
            alias /app/maintenance/;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            # 容器内 Next.js 不可用多为启动中 / 正在被重启，短时间后即可重试
            add_header Retry-After 30 always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        location / {
            proxy_pass http://frontend;
            # Next.js 无响应（启动中 / 进程退出）时回退到静态维护页，状态码强制 503；
            # 仅作用于页面请求，/api 的错误码原样返回给前端
            proxy_intercept_errors on;
            error_page 502 504 =503 /maintenance/index.html;
        }
    }
}
